name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, for example 1.0.1 or v1.0.1"
        required: true
        type: string
      source_ref:
        description: "Git ref to build, for example v1.0.0. Defaults to the workflow ref."
        required: false
        type: string
      publish_nuget_org:
        description: "Publish to NuGet.org as well as GitHub Packages"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_PROJECT: src/UntangleDev.Veriphy/UntangleDev.Veriphy.csproj
  GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/UntangleDev/index.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore UntangleDev.Veriphy.slnx

      - name: Build
        run: >
          dotnet build UntangleDev.Veriphy.slnx
          --no-restore
          -c Release
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test UntangleDev.Veriphy.slnx --no-build -c Release --verbosity normal

      - name: Pack
        run: >
          dotnet pack "$PACKAGE_PROJECT"
          --no-build
          -c Release
          -o ./artifacts
          -p:Version=${{ steps.version.outputs.version }}

      - name: Publish to NuGet.org
        if: github.event_name == 'release' || inputs.publish_nuget_org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Add GitHub Packages source
        run: >
          dotnet nuget add source
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --name github
          "$GITHUB_PACKAGES_SOURCE"

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source github
          --skip-duplicate
