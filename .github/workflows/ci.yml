name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore UntangleDev.Veriphy.slnx

      - name: Build
        run: dotnet build UntangleDev.Veriphy.slnx --no-restore -c Release

      - name: Test
        run: dotnet test UntangleDev.Veriphy.slnx --no-build -c Release --verbosity normal
